name: Go tests
on: [push]
jobs:

  build:
    name: Test
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.x
      uses: https://code.forgejo.org/actions/setup-go@v5
      with:
        go-version: ^1.23
      id: go

    - name: Check out code into the Go module directory
      uses: https://code.forgejo.org/actions/checkout@v6

    - name: Build
      run: make build
