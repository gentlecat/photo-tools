name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up Go
        uses: https://code.forgejo.org/actions/setup-go@v6
        with:
          go-version: ^1.23

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v6

      - name: Build binaries
        run: |
          mkdir -p dist

          # Linux (Unraid / most servers)
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -o dist/xmp-rating-clean-linux-amd64  ./cmd/xmp-rating-clean
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -o dist/xmp-rating-clean-linux-arm64  ./cmd/xmp-rating-clean
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -o dist/xmp-cleanup-linux-amd64       ./cmd/xmp-cleanup
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -o dist/xmp-cleanup-linux-arm64       ./cmd/xmp-cleanup

          # macOS
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -o dist/xmp-rating-clean-darwin-amd64 ./cmd/xmp-rating-clean
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -o dist/xmp-rating-clean-darwin-arm64 ./cmd/xmp-rating-clean
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -o dist/xmp-cleanup-darwin-amd64      ./cmd/xmp-cleanup
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -o dist/xmp-cleanup-darwin-arm64      ./cmd/xmp-cleanup

          # Windows
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o dist/xmp-rating-clean-windows-amd64.exe ./cmd/xmp-rating-clean
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o dist/xmp-cleanup-windows-amd64.exe      ./cmd/xmp-cleanup

      - name: Update latest release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          API: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
        run: |
          # Delete existing "latest" release if it exists
          EXISTING_ID=$(curl -s "$API/repos/$REPO/releases/tags/latest" \
            -H "Authorization: token $FORGEJO_TOKEN" \
            | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)

          if [ -n "$EXISTING_ID" ]; then
            echo "Deleting existing latest release (ID: $EXISTING_ID)..."
            curl -s -X DELETE "$API/repos/$REPO/releases/$EXISTING_ID" \
              -H "Authorization: token $FORGEJO_TOKEN"
          fi

          # Delete and recreate the "latest" tag so it points to the new commit
          curl -s -X DELETE "$API/repos/$REPO/tags/latest" \
            -H "Authorization: token $FORGEJO_TOKEN" || true

          # Create a new "latest" release
          RELEASE_ID=$(curl -s -X POST "$API/repos/$REPO/releases" \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"latest\",\"name\":\"latest\",\"draft\":false,\"prerelease\":false}" \
            | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)

          echo "Release ID: $RELEASE_ID"

          # Upload each binary
          for file in dist/*; do
            filename=$(basename "$file")
            echo "Uploading $filename..."
            curl -s -X POST "$API/repos/$REPO/releases/$RELEASE_ID/assets?name=$filename" \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file"
          done
